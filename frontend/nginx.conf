upstream proof3161_backend {
    zone proof3161_backend 64k;

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    server backend:8080 resolve;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # The application sends hashes and receipts, not original documents.
    client_max_body_size 256k;

    location = /api {
        return 404;
    }

    location /api/ {
        # No trailing slash or URI: retain the complete /api/... path.
        proxy_pass http://proof3161_backend;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $http_host;

        # Replace client-supplied forwarding information at this edge.
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Forwarded-Ssl "";

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 75s;

        # Preserve application error responses and avoid implicit retries.
        proxy_intercept_errors off;
        proxy_next_upstream off;
        proxy_redirect off;
    }

    location = /actuator {
        return 404;
    }

    location ^~ /actuator/ {
        return 404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}