spring.application.name=Proof 3161

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/proof3161}
spring.datasource.username=${DB_USERNAME:proof3161}
spring.datasource.password=${DB_PASSWORD}

#Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# TSA
tsa.url=${TSA_URL}
tsa.trusted-root-path=${TSA_TRUSTED_ROOT_PATH}
