name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CI: "true"

jobs:
  backend:
    name: Backend and RFC 3161
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: >-
            ${{ github.event_name != 'push' ||
                github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Check Docker availability
        run: docker info

      - name: Run backend tests, archived-token tests, and packaging
        run: |
          env -u TSA_URL -u TSA_TRUSTED_ROOT_PATH \
            bash ./gradlew \
              --no-daemon \
              --stacktrace \
              --continue \
              --rerun-tasks \
              test offlineProofTest bootJar

      - name: Confirm critical integration suites executed
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          package = "io.github.tokagero8.proof3161"

          required = {
              (
                  "test",
                  f"{package}.infrastructure.persistence.JpaProofRepositoryAdapterIntegrationTest",
              ): 4,
              (
                  "test",
                  f"{package}.proof.api.ProofApiIntegrationTest",
              ): 2,
              (
                  "offlineProofTest",
                  f"{package}.verification.Rfc3161PortableProofIntegrationTest",
              ): 7,
          }

          for (task, class_name), minimum_tests in required.items():
              path = Path("build/test-results") / task / f"TEST-{class_name}.xml"

              if not path.is_file():
                  raise SystemExit(f"Missing required test report: {path}")

              suite = ET.parse(path).getroot()
              counts = {
                  key: int(suite.get(key, "0"))
                  for key in ("tests", "failures", "errors", "skipped")
              }

              print(f"{task}: {class_name}: {counts}")

              if counts["tests"] < minimum_tests:
                  raise SystemExit(f"Too few tests executed in {class_name}")

              if any(counts[key] for key in ("failures", "errors", "skipped")):
                  raise SystemExit(f"Required suite did not fully pass: {class_name}")
          PY

      - name: Upload backend reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: |
            build/reports/tests/
            build/test-results/
          if-no-files-found: warn
          retention-days: 14

  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest
        run: |
          mkdir -p test-results
          npm test -- \
            --reporter=default \
            --reporter=junit \
            --outputFile=test-results/vitest.xml

      - name: Run ESLint
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Upload Vitest report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-vitest-report
          path: frontend/test-results/vitest.xml
          if-no-files-found: warn
          retention-days: 14

  playwright:
    name: Chromium E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run deterministic browser tests
        run: >-
          npm run test:e2e --
          --project=chromium
          --workers=1
          --timeout=30000
          --global-timeout=600000

      - name: Upload Playwright reports and failure evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: warn
          retention-days: 14

  compose:
    name: Compose configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check Compose availability
        run: docker compose version

      - name: Validate Compose configuration
        env:
          HTTP_PORT: "8088"
          DB_NAME: proof3161_ci
          POSTGRES_ADMIN_USERNAME: proof3161_ci_admin
          POSTGRES_ADMIN_PASSWORD: ci-admin-config-validation-only
          DB_USERNAME: proof3161_ci
          DB_PASSWORD: ci-config-validation-only
          TSA_URL: https://tsa.invalid/tsr
          TSA_ROOT_CERT_FILE: ./src/test/resources/fixtures/rfc3161/tsa-root.pem
        run: |
          test -f "$TSA_ROOT_CERT_FILE"
          docker compose \
            --env-file .env.example \
            -f compose.yaml \
            config --quiet