# Trust forwarding information only from the configured Caddy container.
set_real_ip_from 172.30.90.2;
real_ip_header X-Forwarded-For;
real_ip_recursive off;

# $realip_remote_addr retains the original connection peer after real-IP
# processing. Requests reaching the API must have arrived through Caddy.
map $realip_remote_addr $request_from_caddy {
    default 0;
    172.30.90.2 1;
}

map "$request_method:$uri" $proof_client_key {
    default "";
    "~^POST:/api/v1(?:;[^/]*)?/proofs(?:;[^/]*)?/?$" $binary_remote_addr;
}

map "$request_method:$uri" $verification_client_key {
    default "";
    "~^POST:/api/v1(?:;[^/]*)?/verifications(?:;[^/]*)?/?$" $binary_remote_addr;
}

map $proof_client_key $proof_global_key {
    "" "";
    default proof;
}

map $verification_client_key $verification_global_key {
    "" "";
    default verification;
}

limit_req_zone $proof_client_key
    zone=proof_rate_client:1m rate=6r/m;
limit_req_zone $proof_global_key
    zone=proof_rate_global:64k rate=30r/m;

limit_req_zone $verification_client_key
    zone=verification_rate_client:1m rate=30r/m;
limit_req_zone $verification_global_key
    zone=verification_rate_global:64k rate=120r/m;

limit_conn_zone $proof_client_key zone=proof_conn_client:1m;
limit_conn_zone $proof_global_key zone=proof_conn_global:64k;
limit_conn_zone $verification_client_key zone=verification_conn_client:1m;
limit_conn_zone $verification_global_key zone=verification_conn_global:64k;

upstream proof3161_backend {
    zone proof3161_backend 64k;

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    server backend:8080 resolve;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Requests contain hashes and receipts, not original documents.
    client_max_body_size 256k;

    location = /api {
        return 404;
    }

    location /api/ {
        if ($request_from_caddy = 0) {
            return 403;
        }

        limit_req_status 429;
        limit_conn_status 503;

        limit_req zone=proof_rate_client burst=2 nodelay;
        limit_req zone=proof_rate_global burst=4 nodelay;
        limit_req zone=verification_rate_client burst=4 nodelay;
        limit_req zone=verification_rate_global burst=8 nodelay;

        limit_conn proof_conn_client 1;
        limit_conn proof_conn_global 2;
        limit_conn verification_conn_client 2;
        limit_conn verification_conn_global 4;

        # Preserve the complete /api/... path.
        proxy_pass http://proof3161_backend;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $http_host;

        # Reconstruct one authoritative set of forwarding headers.
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Forwarded-Ssl "";
        proxy_set_header X-Real-IP "";

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 75s;

        proxy_intercept_errors off;
        proxy_next_upstream off;
        proxy_redirect off;
    }

    location = /actuator {
        return 404;
    }

    location ^~ /actuator/ {
        return 404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}