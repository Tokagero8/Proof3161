services:
  backend:
    image: python:3.13-alpine
    command: ["python", "/check.py", "server"]
    volumes:
      - "${PROOF3161_ROOT}/deploy/tests/check.py:/check.py:ro"
    networks:
      check:
        ipv4_address: 172.30.90.3
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/__state', timeout=2).close()" ]
      interval: 1s
      timeout: 3s
      retries: 30

  frontend:
    build:
      context: "${PROOF3161_ROOT}/frontend"
    volumes:
      - "${PROOF3161_ROOT}/deploy/nginx.production.conf:/etc/nginx/conf.d/default.conf:ro"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      check:
        ipv4_address: 172.30.90.4
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/index.html"]
      interval: 1s
      timeout: 3s
      retries: 30

  caddy:
    image: caddy:2-alpine
    environment:
      PUBLIC_DOMAIN: proof.test
      ACME_EMAIL: test@example.invalid
    volumes:
      - "${NGINX_TEST_DIR}/Caddyfile:/etc/caddy/Caddyfile:ro"
    ports:
      - "127.0.0.1:8099:8080"
    depends_on:
      frontend:
        condition: service_healthy
    networks:
      check:
        ipv4_address: 172.30.90.2
      browser: {}

  check:
    image: python:3.13-alpine
    profiles: ["tools"]
    network_mode: "service:caddy"
    volumes:
      - "${PROOF3161_ROOT}/deploy/tests/check.py:/check.py:ro"
    entrypoint: ["python", "/check.py"]

networks:
  browser: {}
  check:
    internal: true
    ipam:
      config:
        - subnet: 172.30.90.0/29